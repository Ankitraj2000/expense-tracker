# ============================================================
# Expense Tracker — Application Configuration (Development)
# ============================================================

spring.application.name=expense-tracker

# ── Server ───────────────────────────────────────────────────
server.port=8080

# ── PostgreSQL DataSource ─────────────────────────────────────
# For local development, replace with your local DB credentials
# For Neon cloud, use: jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Connection Pool ───────────────────────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway Migration ──────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT Configuration ─────────────────────────────────────────
# IMPORTANT: Replace this with a strong 256-bit secret in production!
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# ── CORS ──────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Admin Configuration ───────────────────────────────────────
admin.email=${ADMIN_EMAIL:admin@expensetracker.com}

# ── Jackson ───────────────────────────────────────────────────
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
